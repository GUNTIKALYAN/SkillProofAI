http:
  middlewares:
    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
    body-limit:
      buffering:
        maxRequestBodyBytes: 6291456
    ip-limit:
      rateLimit:
        average: 300
        period: 1m
        burst: 100
