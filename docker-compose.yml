services:
  traefik:
    image: traefik:v3.6
    container_name: skillproof-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.api.address=:8000
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: skillproof-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillproof}
      POSTGRES_DB: ${POSTGRES_DB:-skillproof}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillproof} -d ${POSTGRES_DB:-skillproof}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mcp

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    deploy:
      replicas: 2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skillproof}:${POSTGRES_PASSWORD:-skillproof}@postgres:5432/${POSTGRES_DB:-skillproof}
      SKILLGRAPH_URL: http://skillgraph:8000/mcp
      REDIS_URL: redis://redis:6379/0
      GITHUB_MCP_URL: http://mcp-github:8000/mcp
      TAVILY_MCP_URL: http://mcp-tavily:8000/mcp
      VERIFY_MCP_URL: http://mcp-verify:8000/mcp
      GITHUB_TOKEN: ""
      TAVILY_API_KEY: ""
      MCP_PROBE: "true"
    volumes:
      - ./Backend/.logs:/app/.logs
    labels:
      - traefik.enable=true
      - traefik.docker.network=skillproof-app
      - traefik.http.routers.api.rule=PathPrefix(`/api`) || Path(`/healthz`) || Path(`/readyz`) || Path(`/metrics`)
      - traefik.http.routers.api.entrypoints=api
      - traefik.http.routers.api.priority=100
      - traefik.http.routers.api.middlewares=secure-headers@file,ip-limit@file,body-limit@file
      - traefik.http.routers.api.service=api
      - traefik.http.routers.api-tls.rule=PathPrefix(`/api`) || Path(`/healthz`) || Path(`/readyz`) || Path(`/metrics`)
      - traefik.http.routers.api-tls.entrypoints=websecure
      - traefik.http.routers.api-tls.tls=true
      - traefik.http.routers.api-tls.priority=100
      - traefik.http.routers.api-tls.middlewares=secure-headers@file,ip-limit@file,body-limit@file
      - traefik.http.routers.api-tls.service=api
      - traefik.http.services.api.loadbalancer.server.port=8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      skillgraph:
        condition: service_healthy
      mcp-github:
        condition: service_started
      mcp-tavily:
        condition: service_started
      mcp-verify:
        condition: service_started
    networks:
      - app
      - mcp
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: skillproof-worker
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skillproof}:${POSTGRES_PASSWORD:-skillproof}@postgres:5432/${POSTGRES_DB:-skillproof}
      SKILLGRAPH_URL: http://skillgraph:8000/mcp
      REDIS_URL: redis://redis:6379/0
      GITHUB_MCP_URL: http://mcp-github:8000/mcp
      TAVILY_MCP_URL: http://mcp-tavily:8000/mcp
      VERIFY_MCP_URL: http://mcp-verify:8000/mcp
      GITHUB_TOKEN: ""
      TAVILY_API_KEY: ""
      MCP_PROBE: "true"
    volumes:
      - ./Backend/.logs:/app/.logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      skillgraph:
        condition: service_healthy
      mcp-github:
        condition: service_started
      mcp-tavily:
        condition: service_started
      mcp-verify:
        condition: service_started
    networks:
      - app
      - mcp
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: skillproof-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mcp

  neo4j:
    image: neo4j:5.26.0
    container_name: skillproof-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-skillproof-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-skillproof-neo4j}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mcp

  skillgraph:
    build:
      context: ./mcp_servers/skillgraph
    container_name: skillproof-skillgraph
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-skillproof-neo4j}
      SKILLGRAPH_PUBLIC_URL: http://skillgraph:8000/mcp
      LOG_DIR: /logs/mcp
    volumes:
      - ./Backend/.logs:/logs
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - mcp
    restart: unless-stopped

  mcp-github:
    build:
      context: ./mcp_servers/github
    container_name: skillproof-mcp-github
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_MCP_TOKEN: ${GITHUB_MCP_TOKEN:-}
      GITHUB_PUBLIC_URL: http://mcp-github:8000/mcp
      LOG_DIR: /logs/mcp
    volumes:
      - ./Backend/.logs:/logs
    networks:
      - app
      - mcp
    restart: unless-stopped

  mcp-tavily:
    build:
      context: ./mcp_servers/tavily
    container_name: skillproof-mcp-tavily
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_MCP_TOKEN: ${TAVILY_MCP_TOKEN:-}
      TAVILY_PUBLIC_URL: http://mcp-tavily:8000/mcp
      LOG_DIR: /logs/mcp
    volumes:
      - ./Backend/.logs:/logs
    networks:
      - app
      - mcp
    restart: unless-stopped

  mcp-verify:
    build:
      context: ./mcp_servers/verify
    container_name: skillproof-mcp-verify
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      VERIFY_MCP_TOKEN: ${VERIFY_MCP_TOKEN:-}
      REDIS_URL: redis://redis:6379/0
      VERIFY_PUBLIC_URL: http://mcp-verify:8000/mcp
      LOG_DIR: /logs/mcp
    volumes:
      - ./Backend/.logs:/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app
      - mcp
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    container_name: skillproof-frontend
    ports:
      - "3000:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls=true
      - traefik.http.routers.web.priority=1
      - traefik.http.routers.web.middlewares=secure-headers@file,ip-limit@file
      - traefik.docker.network=skillproof-app
      - traefik.http.services.web.loadbalancer.server.port=8080
    depends_on:
      - backend
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    name: skillproof-app
  mcp:
    name: skillproof-mcp
    internal: true

volumes:
  postgres_data:
  neo4j_data:
