services:
  postgres:
    image: postgres:16-alpine
    container_name: skillproof-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillproof}
      POSTGRES_DB: ${POSTGRES_DB:-skillproof}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillproof} -d ${POSTGRES_DB:-skillproof}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mcp

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: skillproof-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skillproof}:${POSTGRES_PASSWORD:-skillproof}@postgres:5432/${POSTGRES_DB:-skillproof}
      MCP_URL: http://mcp:8000/mcp
      REDIS_URL: redis://redis:6379/0
      MCP_PROBE: "true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp:
        condition: service_healthy
    networks:
      - app
      - mcp
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: skillproof-gateway
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/0
      FRONTEND_DIR: /app/frontend
    ports:
      - "8000:8000"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - mcp
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: skillproof-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mcp

  neo4j:
    image: neo4j:5.26.0
    container_name: skillproof-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-skillproof-neo4j}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"${NEO4J_PASSWORD:-skillproof-neo4j}\" 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mcp

  mcp:
    build:
      context: ./mcp_server
    container_name: skillproof-mcp
    env_file:
      - .env
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-skillproof-neo4j}
      MCP_PUBLIC_URL: http://mcp:8000/mcp
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - mcp
      - app
    restart: unless-stopped

networks:
  app:
    name: skillproof-app
  mcp:
    name: skillproof-mcp
    internal: true

volumes:
  postgres_data:
  neo4j_data:
