services:
  postgres:
    image: postgres:16-alpine
    container_name: skillproof-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillproof}
      POSTGRES_DB: ${POSTGRES_DB:-skillproof}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillproof} -d ${POSTGRES_DB:-skillproof}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: skillproof-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skillproof}:${POSTGRES_PASSWORD:-skillproof}@postgres:5432/${POSTGRES_DB:-skillproof}
      SKILLGRAPH_URL: http://skillgraph:8000/mcp
      REDIS_URL: redis://redis:6379/0
      GITHUB_MCP_URL: http://mcp-github:8082/mcp
      TAVILY_MCP_URL: http://mcp-tavily:8000/mcp
      VERIFY_MCP_URL: http://mcp-verify:8000/mcp
      GITHUB_TOKEN: ""
      TAVILY_API_KEY: ""
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      skillgraph:
        condition: service_healthy
      mcp-github:
        condition: service_started
      mcp-tavily:
        condition: service_started
      mcp-verify:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: skillproof-worker
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skillproof}:${POSTGRES_PASSWORD:-skillproof}@postgres:5432/${POSTGRES_DB:-skillproof}
      SKILLGRAPH_URL: http://skillgraph:8000/mcp
      REDIS_URL: redis://redis:6379/0
      GITHUB_MCP_URL: http://mcp-github:8082/mcp
      TAVILY_MCP_URL: http://mcp-tavily:8000/mcp
      VERIFY_MCP_URL: http://mcp-verify:8000/mcp
      GITHUB_TOKEN: ""
      TAVILY_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      skillgraph:
        condition: service_healthy
      mcp-github:
        condition: service_started
      mcp-tavily:
        condition: service_started
      mcp-verify:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: skillproof-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26.0
    container_name: skillproof-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-skillproof-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-skillproof-neo4j}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  skillgraph:
    build:
      context: ./mcp_servers/skillgraph
    container_name: skillproof-skillgraph
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-skillproof-neo4j}
      SKILLGRAPH_PUBLIC_URL: http://skillgraph:8000/mcp
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mcp-github:
    image: ghcr.io/github/github-mcp-server:v0.31.0
    container_name: skillproof-mcp-github
    command: ["http", "--port", "8082", "--read-only", "--toolsets", "repos"]
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_TOOLSETS: repos
      GITHUB_READ_ONLY: "true"
    restart: unless-stopped

  mcp-tavily:
    build:
      context: ./mcp_servers/tavily
    container_name: skillproof-mcp-tavily
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_MCP_TOKEN: ${TAVILY_MCP_TOKEN:-}
      TAVILY_PUBLIC_URL: http://mcp-tavily:8000/mcp
    restart: unless-stopped

  mcp-verify:
    build:
      context: ./mcp_servers/verify
    container_name: skillproof-mcp-verify
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      VERIFY_MCP_TOKEN: ${VERIFY_MCP_TOKEN:-}
      REDIS_URL: redis://redis:6379/0
      VERIFY_PUBLIC_URL: http://mcp-verify:8000/mcp
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    container_name: skillproof-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
