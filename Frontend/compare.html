<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillProof AI - Compare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="app.html">SkillProof AI</a>
      <nav class="nav" aria-label="Account">
        <a href="app.html">New analysis</a>
        <a href="history.html">History</a>
        <a href="chat.html">Chat</a>
        <a href="compare.html" aria-current="page">Compare</a>
        <a href="admin.html" data-admin hidden>Admin</a>
        <span class="user-email" data-email></span>
        <button class="button button-danger" type="button" data-delete-account>Delete my data</button>
        <button class="button button-quiet" type="button" data-logout>Log out</button>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1>Compare jobs</h1>
    <p class="lede">Rank up to 10 job descriptions against your latest analysis. This uses one of your hourly analysis runs.</p>
    <form id="compareForm" class="card">
      <div id="jobFields"></div>
      <button class="button button-quiet" type="button" id="addJob">Add a job</button>
      <p id="compareError" class="banner banner-error" hidden></p>
      <div class="form-actions">
        <button class="button button-primary" type="submit">Rank jobs</button>
      </div>
    </form>
    <section id="compareResult" class="card" hidden></section>
  </main>
  <script type="module" src="js/compare.js"></script>
</body>
</html>
