<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillProof AI - History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="app.html">SkillProof AI</a>
      <nav class="nav" aria-label="Account">
        <a href="app.html">New analysis</a>
        <a href="history.html" aria-current="page">History</a>
        <a href="chat.html">Chat</a>
        <a href="compare.html">Compare</a>
        <a href="admin.html" data-admin hidden>Admin</a>
        <span class="user-email" data-email></span>
        <button class="button button-danger" type="button" data-delete-account>Delete my data</button>
        <button class="button button-quiet" type="button" data-logout>Log out</button>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1>History</h1>
    <p class="lede">Past analyses stay on your account. Open one to see the score, audit, and plan.</p>
    <section class="card">
      <h2>Score trend</h2>
      <div id="trend" class="trend"></div>
      <p id="trendNote" class="helper"></p>
    </section>
    <section class="card">
      <h2>Analyses</h2>
      <p id="historyEmpty" class="helper" hidden></p>
      <div id="historyList"></div>
    </section>
  </main>
  <script type="module" src="js/history.js"></script>
</body>
</html>
