<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillProof AI - Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="app.html">SkillProof AI</a>
    </div>
  </header>
  <main class="page">
    <section class="card narrow">
      <h1>Log in</h1>
      <p class="lede">Use the account you created for this app.</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="formError" class="banner banner-error" hidden></p>
        <div class="form-actions">
          <button class="button button-primary" type="submit">Log in</button>
        </div>
      </form>
      <p class="helper">No account yet? <a href="signup.html">Sign up</a></p>
    </section>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
