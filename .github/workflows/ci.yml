name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse a tracked env file
        run: test -z "$(git ls-files .env)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.17.0

      - name: Backend ruff
        working-directory: Backend
        run: ruff check .

      - name: Backend tests
        working-directory: Backend
        run: pytest

      - name: Gateway ruff
        working-directory: gateway
        run: ruff check .

      - name: Gateway tests
        working-directory: gateway
        run: pytest
