name: CI – Dockerized SkillProof App

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # BACKEND

      - name: Build backend image
        run: |
          docker build -f Backend/Dockerfile -t skillproof-backend:ci .

      - name: Run backend tests
        run: |
          docker run --rm -e GROQ_API_KEY=test_dummy_key skillproof-backend:ci pytest

      - name: Build skill graph image
        run: |
          docker build -f mcp_servers/skillgraph/Dockerfile -t skillproof-skillgraph:ci mcp_servers/skillgraph

      - name: Run skill graph tests
        run: |
          docker run --rm --entrypoint python skillproof-skillgraph:ci -m pytest

      - name: Build Tavily MCP image
        run: |
          docker build -f mcp_servers/tavily/Dockerfile -t skillproof-tavily:ci mcp_servers/tavily

      - name: Run Tavily MCP tests
        run: |
          docker run --rm --entrypoint python skillproof-tavily:ci -m pytest

      - name: Build Verify MCP image
        run: |
          docker build -f mcp_servers/verify/Dockerfile -t skillproof-verify:ci mcp_servers/verify

      - name: Run Verify MCP tests
        run: |
          docker run --rm --entrypoint python skillproof-verify:ci -m pytest

      # FRONTEND

      - name: Build frontend image
        run: |
          docker build -t skillproof-frontend:ci ./Frontend

      # DOCKER HUB LOGIN (main only)
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # PUSH IMAGES (main only)
      - name: Push backend image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag skillproof-backend:ci ${{ secrets.DOCKER_USERNAME }}/skillproof-backend:latest
          docker tag skillproof-backend:ci ${{ secrets.DOCKER_USERNAME }}/skillproof-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/skillproof-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/skillproof-backend:${{ github.sha }}

      - name: Push frontend image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag skillproof-frontend:ci ${{ secrets.DOCKER_USERNAME }}/skillproof-frontend:latest
          docker tag skillproof-frontend:ci ${{ secrets.DOCKER_USERNAME }}/skillproof-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/skillproof-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/skillproof-frontend:${{ github.sha }}
